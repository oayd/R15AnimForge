[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r15-animforge"
version = "1.0.0"
description = "Offline CyberConnect2 XFBIN to Roblox R15 FBX converter, validator, and animation pack builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
animforge = "animforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
