name: Build, Sign & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (windows-latest)
    runs-on: windows-latest
    outputs:
      unsigned_artifact_id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      version_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "main") { $tag = "v1.0.0-manual" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build & test dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install numpy pytest pyinstaller -e .

      - name: Run unit test suite
        shell: pwsh
        run: |
          .\.venv\Scripts\pytest.exe -v

      - name: Build portable package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\packaging\build.ps1 -SkipTests
          Copy-Item .\LICENSE .\dist\AnimForge\LICENSE -Force
          if (Test-Path .\docs\R15_AnimForge_User_Guide.pdf) {
            Copy-Item .\docs\R15_AnimForge_User_Guide.pdf .\dist\AnimForge\R15_AnimForge_User_Guide.pdf -Force
          }
          .\dist\AnimForge\AnimForge.exe selftest --json

      - name: Upload unsigned executable for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/AnimForge/AnimForge.exe
          if-no-files-found: error

      - name: Upload full portable directory
        uses: actions/upload-artifact@v4
        with:
          name: portable-dir
          path: dist/AnimForge
          if-no-files-found: error

  sign:
    name: Sign via SignPath Foundation
    needs: build
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'r15-animforge' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.build.outputs.unsigned_artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 600
          output-artifact-directory: signed

      - name: Verify Authenticode signature on signed binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem .\signed -Recurse -Filter "AnimForge.exe" | Select-Object -First 1
          if (-not $exe) { throw "Signed AnimForge.exe missing from SignPath output directory." }
          $sig = Get-AuthenticodeSignature $exe.FullName
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($sig.Status -ne 'Valid') { throw "Authenticode signature invalid: $($sig.Status) - $($sig.StatusMessage)" }

      - name: Upload signed executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-exe
          path: signed/**/AnimForge.exe
          if-no-files-found: error

  release:
    name: Package Checksums, Attest & Publish Release
    needs: [build, sign]
    if: ${{ always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download portable build directory
        uses: actions/download-artifact@v4
        with:
          name: portable-dir
          path: release_pkg/AnimForge

      - name: Download signed executable (when SignPath enabled)
        if: ${{ needs.sign.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: signed-exe
          path: signed_dl

      - name: Replace executable with signed binary & assemble release assets
        shell: pwsh
        run: |
          if ("${{ needs.sign.result }}" -eq "success") {
            $signedExe = Get-ChildItem .\signed_dl -Recurse -Filter "AnimForge.exe" | Select-Object -First 1
            if (-not $signedExe) { throw "Expected signed AnimForge.exe not found." }
            Copy-Item $signedExe.FullName .\release_pkg\AnimForge\AnimForge.exe -Force
            $sig = Get-AuthenticodeSignature .\release_pkg\AnimForge\AnimForge.exe
            if ($sig.Status -ne 'Valid') { throw "Signed binary check failed: $($sig.Status)" }
          }
          New-Item -ItemType Directory -Force -Path .\release_out | Out-Null
          $tag = "${{ needs.build.outputs.version_tag }}"
          $zipPath = ".\release_out\R15AnimForge-$tag-win64-portable.zip"
          Compress-Archive -Path .\release_pkg\AnimForge\* -DestinationPath $zipPath -CompressionLevel Optimal
          Copy-Item .\release_pkg\AnimForge\AnimForge.exe .\release_out\AnimForge.exe -Force
          $hashes = foreach ($f in (Get-ChildItem .\release_out -File | Sort-Object Name)) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          Set-Content -Path .\release_out\SHA256SUMS.txt -Value $hashes -Encoding ASCII
          Get-Content .\release_out\SHA256SUMS.txt

      - name: Generate GitHub Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release_out/*.zip
            release_out/AnimForge.exe
            release_out/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Code Signing & Verification

            Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).

            - **Privacy Policy:** R15 AnimForge runs 100% offline with zero telemetry and will not transfer any information to other networked systems unless specifically requested by the user. See [`SECURITY.md`](https://github.com/oayd/R15AnimForge/blob/main/SECURITY.md) for Authenticode, SHA-256 (`SHA256SUMS.txt`), and GitHub Build Provenance Attestation verification steps.
          files: |
            release_out/*.zip
            release_out/AnimForge.exe
            release_out/SHA256SUMS.txt
